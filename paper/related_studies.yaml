# Comparison table of the related work (paper/generated/related_studies.tex, src/paper/related.py).
# One entry per study read in FULL TEXT. Each cell has a short value and the passages of the paper that support
# it, copied verbatim from the extracted text (paper/refs/fulltext/<key>.txt, not versioned) with their page.
# The extraction glues some words and cuts two-column lines: the passages are kept as extracted, so that
# scripts/11_paper.py and the tests can find them again. "not stated": the paper gives no such information.
# `read_whole_section: true` marks a cell that reports an absence after reading the whole experimental section.
# Read on 2026-11-24 (three readings by Claude subagents, passages checked by string matching).

caption: "Protocol of the closest studies that predict an outcome of peer review, as stated in their full text."

columns:
  data: Reviews of
  target: Predicted
  inputs: Read by the model
  review_version: Version of the reviews
  split: Split
  score_baseline: Baseline on the reviewers' scores

widths_mm: {study: 18, data: 20, target: 23, inputs: 26, review_version: 20, split: 22, score_baseline: 18}

