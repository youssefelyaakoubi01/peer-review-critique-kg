# The present study, described from its own protocol (Sections 3 and 4 of the article).
this_study:
  data: "ICLR 2024, 2025, 2026"
  target: "decision of the paper"
  inputs: "typed critiques, review text and initial scores, title and abstract of the paper"
  review_version: "initial scores; sentences written after the author response removed where they are identified"
  split: "by year: training 2024, test 2025, holdout 2026"
  score_baseline: "yes: logistic regression on the initial ratings"

