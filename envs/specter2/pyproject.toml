# Separate environment for SPECTER2 (phase 5, article embeddings).
# SPECTER2 is a base model plus an adapter loaded with the `adapters` library, which
# pins an older transformers than the main environment. Only
# scripts/05b_embed_articles.py runs here; it exchanges files with the main code.
[project]
name = "peer-review-kg-specter2"
version = "0.1.0"
description = "SPECTER2 environment for article embeddings"
requires-python = "==3.11.*"
dependencies = [
    "torch==2.14.0",
    "adapters==1.3.0",
    "transformers==4.57.6",
    "numpy",
    "pandas==3.1.1",
    "pyarrow==26.0.1",
    "pyyaml==6.0.3",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu132" }
